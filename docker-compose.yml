services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: reserveflow
      POSTGRES_USER: reserveflow
      POSTGRES_PASSWORD: reserveflow_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - reserveflow_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reserveflow -d reserveflow"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  reserveflow_pgdata:
